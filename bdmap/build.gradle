plugins {
    alias(libs.plugins.android.library)
}

android {
    // 编译期用
    // 和 APK 安装无关
    // 可统一用一个 namespace
    // 主要影响生成的 R 类和 BuildConfig 包名
    namespace 'com.zsp.bdmap'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk

        // consumer-rules.pro 会合并到最终 APK
        // consumer-rules.pro 专门用于传递给主应用 (消费者)。它指定的规则是确保主应用在混淆时，能正确处理这个库的代码。这些规则会被打包到 AAR 中。
        // proguard-rules.pro 仅用于当前 Library 自身构建时的混淆
        // proguard-rules.pro 不会自动传递给引用它的 App
        consumerProguardFiles "consumer-rules.pro"

        // 设置支持的 so 库架构
        // 据需选一或多平台 so 库架构
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi', 'armeabi-v7a', 'arm64-v8a'//, 'mips', 'mips64'
        }
    }

    buildTypes {
        release {
            // library 通设 false
            // 交由 App 统一混淆
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // 源代码兼容 Java 11 (可按需设)
        sourceCompatibility rootProject.ext.sourceCompatibility
        // 生成的字节码兼容 Java 11 (可按需设)
        targetCompatibility rootProject.ext.targetCompatibility
    }
}

dependencies {
    api libs.baidumapsdk.location.all
    /*全量定位组件*/
}