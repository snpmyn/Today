/*发布*/
publishing {
    publications {
        release(MavenPublication) {
            groupId = project.group
            artifactId = "core"
            version = project.version

            afterEvaluate {
                from components.release
            }

            pom {
                name = "core"
                description = "Today Android Core Library"
                url = "https://github.com/snpmyn/Today"

                licenses {
                    license {
                        name = "Apache License, Version 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }

                developers {
                    developer {
                        id = "snpmyn"
                        name = "snpmyn"
                        /*email = "snpmyn@126.com"*/
                    }
                }

                scm {
                    connection = "scm:git:https://github.com/snpmyn/Today.git"
                    developerConnection = "scm:git:ssh://git@github.com:snpmyn/Today.git"
                    url = "https://github.com/snpmyn/Today"
                }
            }
        }
    }

    repositories {
        // 本地测试仓库
        maven {
            name = "localTest"
            url = layout.buildDirectory.dir("repo")
        }

        // 如果以后发 Nexus
        /*
        maven {
            name = "nexus"
            url = uri("https://nexus.xxx.com/repository/releases")

            credentials {
                username = nexusUser
                password = nexusPassword
            }
        }
        */
    }
}

